services:
  - type: web
    name: godd-ai
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_CPU_THREADS
        value: 1
      - key: RELEASE_WHISPER_MODEL
        value: 1
      - key: FFMPEG_THREADS
        value: 1
      - key: ENCODER_PRESET
        value: veryfast
      - key: OMP_NUM_THREADS
        value: 1
