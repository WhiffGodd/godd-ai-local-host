<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>AI Videos · Godd AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ai-videos.css">
  <script src="/ai-videos.js" defer></script>
</head>
<body>
  <header class="topbar">
    <nav class="wrap" aria-label="Studio">
      <a class="brand" href="/"><span aria-hidden="true">↯</span> godd.ai</a>
      <div class="nav-links"><a href="/">Clip Studio</a><a href="/ai-videos.html" aria-current="page">AI Videos</a></div>
    </nav>
  </header>
  <main class="wrap">
    <div class="intro">
      <h1>AI Video Studio</h1>
      <p>Turn a prompt into a 50–60 second narrated explainer with animated diagrams.</p>
    </div>
    <div class="workbench">
      <div class="composer">
        <form id="generator">
          <label for="prompt">What should the video explain?</label>
          <textarea id="prompt" rows="4" minlength="8" maxlength="1200" required placeholder="Explain how a bicycle stays upright when it moves. Show how steering corrects a lean."></textarea>
          <div class="examples" aria-label="Example prompts">
            <button type="button" data-topic="Explain how bicycle pedals turn the rear wheel through the crank, chain and rear cog.">Bicycle pedals</button>
            <button type="button" data-topic="Explain why the Moon has phases and how the Sun, Earth and Moon line up.">Moon phases</button>
            <button type="button" data-topic="Explain how a heat pump moves heat from outdoors into a home, step by step.">Heat pumps</button>
          </div>
          <div class="voice-setting">
            <label for="voice">Narration style</label>
            <select id="voice">
              <option value="expressive">Friendly (default)</option>
              <option value="energetic">Energetic</option>
              <option value="documentary">Documentary</option>
            </select>
          </div>
          <div class="generate-actions">
            <button id="generate" class="primary" type="submit" disabled>Generate video</button>
            <button id="sample" class="secondary" type="button" disabled>Render sample</button>
          </div>
          <p id="generationStatus" class="status" role="status">Loading the template library…</p>
        </form>
        <section class="library" aria-labelledby="libraryHeading">
          <div class="library-heading">
            <h2 id="libraryHeading">Templates</h2>
            <span id="templateCount"></span>
          </div>
          <div id="categories" class="filters" aria-label="Filter templates"></div>
          <div id="templateGrid" class="template-grid" aria-label="Choose a video template"></div>
          <button id="moreTemplates" class="secondary more" type="button" hidden>Show more templates</button>
        </section>
      </div>
      <aside class="output" aria-labelledby="previewHeading">
        <h2 id="previewHeading">Preview</h2>
        <div class="preview-shell">
          <canvas id="stylePreview" width="360" height="640" aria-label="Selected template preview" role="img"></canvas>
          <video id="video" controls playsinline preload="metadata" hidden aria-label="Generated explainer"></video>
        </div>
        <p id="selectedStyle" class="selected-style"></p>
        <div id="exportTools" hidden>
          <a id="downloadVideo" class="secondary download">Download MP4</a>
          <section class="publish" aria-labelledby="publishHeading">
            <h2 id="publishHeading">Upload to YouTube</h2>
            <p id="connectionStatus" class="status" role="status"></p>
            <button id="connect" class="secondary" type="button" hidden>Connect YouTube</button>
            <button id="disconnect" class="secondary" type="button" hidden>Disconnect</button>
            <form id="publishForm" hidden>
              <label for="title">Title</label>
              <input id="title" maxlength="100" required>
              <label for="description">Description and hashtags</label>
              <textarea id="description" rows="4" maxlength="5000"></textarea>
              <label for="visibility">Visibility</label>
              <select id="visibility"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select>
              <label for="audience">Made for kids?</label>
              <select id="audience" required><option value="">Choose an audience</option><option value="no">No</option><option value="yes">Yes</option></select>
              <button id="upload" class="primary" type="submit">Upload to YouTube</button>
            </form>
            <p id="publishStatus" class="status" role="status"></p>
          </section>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
